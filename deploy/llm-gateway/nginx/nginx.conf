# Terminacja mTLS przed LiteLLM (testowa). Klient bez certyfikatu podpisanego przez
# ca.crt dostaje blad TLS/400 i ruch nie dochodzi do LiteLLM.
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  server_tokens off;

  # Dziennik dostepu (metadane, bez tresci promptow): kto (DN certyfikatu), co, kiedy.
  log_format gw escape=json
    '{"ts":"$time_iso8601","client_dn":"$ssl_client_s_dn","verify":"$ssl_client_verify",'
    '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes_out":$bytes_sent,"req_time":$request_time,"upstream_time":"$upstream_response_time"}';
  access_log /dev/stdout gw;

  # Streaming SSE: bez buforowania odpowiedzi.
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;
  client_max_body_size 32m;   # duzy kontekst kodu

  upstream litellm { server litellm:4000; keepalive 16; }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate         /etc/nginx/tls/server.crt;
    ssl_certificate_key     /etc/nginx/tls/server.key;
    ssl_protocols           TLSv1.3 TLSv1.2;

    # mTLS: wymagamy certyfikatu klienta podpisanego przez nasze CA.
    ssl_client_certificate  /etc/nginx/tls/ca.crt;
    ssl_verify_client       on;
    ssl_verify_depth        2;

    location / {
      proxy_pass http://litellm;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Tozsamosc z mTLS dla audytu po stronie LiteLLM (nie jest podstawa autoryzacji;
      # autoryzacja to klucz wirtualny). Naglowek od klienta jest nadpisywany.
      proxy_set_header X-Client-DN $ssl_client_s_dn;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # Wewnetrzny healthcheck kontenera (tylko loopback, bez TLS).
  server {
    listen 127.0.0.1:8081;
    location = /nginx-health { return 200 "ok\n"; }
  }
}
