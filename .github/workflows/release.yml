name: Release (Linux & Windows Air-Gapped Bundles)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja wydania (np. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
      prerelease:
        description: "Oznacz jako Pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, Unit & Air-Gapped E2E Tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      tag_name: ${{ steps.resolve-version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version and tag
        id: resolve-version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.version }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          CLEAN_VER="${RAW_TAG#v}"
          TAG_NAME="v${CLEAN_VER}"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build Workspace
        run: pnpm build

      - name: Run Air-Gapped E2E Verification (--network=none mode)
        run: pnpm test:e2e:airgap

  build-linux:
    name: Build Linux Air-Gapped Packages (.tar.gz & .deb)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Generate Linux Air-Gapped Release Artifacts (x64)
        run: |
          node packaging/offline-bundle/build-release-artifacts.mjs \
            --platform linux \
            --arch x64 \
            --version "${{ needs.verify.outputs.version }}" \
            --out-dir dist/release-linux

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/release-linux/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Air-Gapped Packages (.zip & .tar.gz)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Generate Windows Air-Gapped Release Artifacts (x64)
        shell: pwsh
        run: node packaging/offline-bundle/build-release-artifacts.mjs --platform win32 --arch x64 --version "${{ needs.verify.outputs.version }}" --out-dir dist/release-windows

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/release-windows/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (Linux & Windows)
    needs:
      - verify
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: dist/release-combined

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: dist/release-combined

      - name: Generate Combined SHA256SUMS.txt
        working-directory: dist/release-combined
        run: |
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create and Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag_name }}
          name: "Conductor ${{ needs.verify.outputs.tag_name }} (Linux & Windows Air-Gapped)"
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/release-combined/*
